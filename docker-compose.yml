services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doctalk
      POSTGRES_PASSWORD: doctalk
      POSTGRES_DB: doctalk
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctalk -d doctalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./doctalk-server
    ports:
      - "${API_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      API_PORT: "8081"
      DATABASE_URL: postgres://doctalk:doctalk@db:5432/doctalk?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      STORAGE_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
