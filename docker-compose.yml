services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doctalk
      POSTGRES_PASSWORD: doctalk
      POSTGRES_DB: doctalk
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctalk -d doctalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./doctalk-server
    ports:
      - "${API_PORT:-8181}:8181"
    environment:
      PORT: "8181"
      API_PORT: "8181"
      DATABASE_URL: postgres://doctalk:doctalk@db:5432/doctalk?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3917,http://127.0.0.1:3917}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      GUEST_TTL_HOURS: ${GUEST_TTL_HOURS:-168}
      QUIZ_PER_DAY: ${QUIZ_PER_DAY:-5}
      QUIZ_RESET_HOUR: ${QUIZ_RESET_HOUR:-7}
      QUIZ_IP_PER_DAY: ${QUIZ_IP_PER_DAY:-20}
      ASK_PER_MINUTE: ${ASK_PER_MINUTE:-20}
      INGEST_PER_MINUTE: ${INGEST_PER_MINUTE:-10}
      MAX_PAGES: ${MAX_PAGES:-50}
      MAX_ROWS: ${MAX_ROWS:-2000}
      GIN_MODE: release
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      GEMINI_QUIZ_MODEL: ${GEMINI_QUIZ_MODEL:-}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.0-flash}
      GEMINI_CHAT_FALLBACK_MODEL: ${GEMINI_CHAT_FALLBACK_MODEL:-}
      GEMINI_MAX_IN_FLIGHT: ${GEMINI_MAX_IN_FLIGHT:-2}
      GEMINI_RETRY_ATTEMPTS: ${GEMINI_RETRY_ATTEMPTS:-3}
      GEMINI_RETRY_BUDGET_SECONDS: ${GEMINI_RETRY_BUDGET_SECONDS:-8}
      GEMINI_RETRY_BASE_DELAY_MS: ${GEMINI_RETRY_BASE_DELAY_MS:-500}
      GEMINI_RETRY_MAX_DELAY_MS: ${GEMINI_RETRY_MAX_DELAY_MS:-4000}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-25}
      QUIZ_N_MAX: ${QUIZ_N_MAX:-20}
      ASK_TOP_K: ${ASK_TOP_K:-5}
      ASK_TOP_K_MAX: ${ASK_TOP_K_MAX:-20}
      ASK_TIMEOUT_SECONDS: ${ASK_TIMEOUT_SECONDS:-60}
      STORAGE_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
